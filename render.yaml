services:
  - type: web
    name: applied-ai-roadmap-os
    runtime: node
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_OPPORTUNITY_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_DAILY_REQUEST_LIMIT
        value: "180"
