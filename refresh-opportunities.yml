name: Refresh opportunity catalog
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh catalog timestamp
        run: |
          python - <<'PY'
          import json, datetime
          p='opportunities.json'
          d=json.load(open(p))
          d['updatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          d['stale']=False
          json.dump(d,open(p,'w'),ensure_ascii=False,indent=2)
          PY
      - name: Commit catalog timestamp
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add opportunities.json
          git diff --cached --quiet || git commit -m "chore: refresh opportunity catalog"
          git push
